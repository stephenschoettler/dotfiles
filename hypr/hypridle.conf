general {
    lock_cmd = pidof hyprlock || /home/w0lf/.config/hypr/scripts/lock_screen.sh       # pre-render clock image, avoid multiple hyprlock instances.
}

# Brightness dimming is disabled pending a safe restore-path repair.
# The previous brightnessctl save/restore listener repeatedly resumed at raw level 10/800 (1%),
# leaving the desktop effectively black after idle/lock. Locking remains enabled below.

listener {
    timeout = 1800                                # 30min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

# display off + hibernate removed — lid close handles it
