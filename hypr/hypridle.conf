general {
    lock_cmd = pidof hyprlock || /home/w0lf/.config/hypr/scripts/lock_screen.sh       # pre-render clock image, avoid multiple hyprlock instances.
}

listener {
    timeout = 900                                # 15min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

# display off + hibernate removed — lid close handles it
