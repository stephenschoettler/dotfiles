# ==============================================================================
#  Hyprw0lf Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
#  Monitor Setup
# ------------------------------------------------------------------------------

# External Monitors (Left)
# 0x0 position for both to handle either/or usage without overlap issues.
monitor = HDMI-A-1, 1920x1080@119.98Hz, 0x0, 1
monitor = DP-1,     preferred, 0x0, 1

# Internal Laptop Display (Legion Slim 5)
# 'auto' places it to the right of any connected external monitor.
monitor = eDP-2, preferred, auto, 1.25

# Fallback for unexpected displays
monitor = , preferred, auto, 1

# ------------------------------------------------------------------------------
#  Startup Applications
# ------------------------------------------------------------------------------

# System & Environment
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/pam_kwallet_init
exec-once = ~/.config/hypr/scripts/start_polkit_agent.sh

# UI Components & Daemons
exec-once = ~/.config/hypr/scripts/display_profile.sh apply
exec-once = ~/.config/hypr/scripts/monitor_hotplug_watcher.sh
exec-once = waybar
exec-once = hyprpaper
exec-once = ~/.config/hypr/scripts/start_swayosd.sh
exec-once = ~/.config/hypr/scripts/start_hyprsunset.sh
# hypridle is managed by the enabled systemd user service; do not also start it here.
exec-once = swaync
exec-once = thunar --daemon
exec-once = blueman-applet
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data

# ------------------------------------------------------------------------------
#  Input Configuration
# ------------------------------------------------------------------------------

env = XCURSOR_SIZE,24

input {
    kb_layout = us
    follow_mouse = 1
    scroll_method = on_button_down
    scroll_button = 2

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0
}

cursor {
    inactive_timeout = 3
    # Mixed AMD/NVIDIA outputs can make Aquamarine hardware cursor blits fail on HDMI.
    # Symptom: external monitor feels slow/stuttery while laptop panel is smooth.
    no_hardware_cursors = true
}


# -----------------------------------------------------
# Kensington Slimblade Trackball
# -----------------------------------------------------
device {
    name = kensington-slimblade-trackball
    
    # SENSITIVITY 
    sensitivity = -0.5

    # SCROLL FACTOR
    scroll_factor = 1.0

    # ACCELERATION
    accel_profile = adaptive
    
    # DRAG SCROLL
    scroll_method = on_button_down
    scroll_button = 275 # left top: 274 right top: 275
    
    # LEFT HANDED
    # left_handed = true 
   }

# -----------------------------------------------------
# MX Master: Thumb Button (277) -> Workspace Scroll
# -----------------------------------------------------
device {
    name = logitech-usb-receiver-mouse
    
    # SENSITIVITY
    sensitivity = -0.2

    # SCROLL FACTOR
    scroll_factor = 1.0

    # ACCELERATION
    accel_profile = adaptive
    
    # DRAG SCROLL
    #scroll_method = on_button_down
    #scroll_button = 277 # thumb: 277 
}

# ------------------------------------------------------------------------------
#  General Layout & Design
# ------------------------------------------------------------------------------

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2
    col.active_border = rgba(bd93f9ff) rgba(ff79c6ff) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

animations {
    enabled = yes

    # Bezier Curves
    bezier = fluid, 0.05, 0.9, 0.1, 1.05
    bezier = overshoot, 0.13, 0.99, 0.29, 1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    # Animation Rules
    animation = windows, 1, 5, overshoot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, fluid
    animation = border, 1, 10, default
    animation = fade, 1, 10, smoothIn
    animation = fadeDim, 1, 10, smoothIn
    animation = workspaces, 1, 6, fluid, slide
    animation = specialWorkspace, 1, 5, fluid, slidefadevert 15%
}

dwindle {
    preserve_split = yes
}

# ------------------------------------------------------------------------------
#  Unified Window Rules (Fixed Sizing)
# ------------------------------------------------------------------------------

# -- Browsers --
# Brave: Save/Open (Fixed 900x600 - a standard "comfortable" dialog size)
windowrule = match:class ^brave$, match:title ^(Save File|Open File)$, dim_around on, float on, center on, size (monitor_w*0.5) (monitor_h*0.6)

# Brave: Permissions (Fixed 500x300 - enough for "Allow/Block" buttons)
windowrule = match:class ^brave$, match:title .*wants to.*, dim_around on, float on, center on, size (monitor_w*0.3) (monitor_h*0.3)

# Brave: Google Sign-in
windowrule = match:class ^brave$, match:title ^Sign in - Google Accounts.*, dim_around on, float on, center on, size (monitor_w*0.4) (monitor_h*0.8)

# Brave: New Tab / Untitled (Initial Title)
windowrule = match:class ^brave-browser$, match:initial_title ^Untitled.*$, float on, center on, size (monitor_w*0.3) (monitor_h*0.6)

# Picture in Picture (PiP)
windowrule = match:title ^Picture in picture$, float on, pin on, size (monitor_w*0.3) (monitor_h*0.3), move (monitor_w*0.7-20) (monitor_h*0.7-20)

# -- System Tools --
# Audio (Pavucontrol)
windowrule = match:class ^org.pulseaudio.pavucontrol$, float on, center on, size (monitor_w*0.55) (monitor_h*0.72)

# Bluetooth (Blueman)
windowrule = match:class ^blueman-manager$, float on, center on, size (monitor_w*0.4) (monitor_h*0.5)

# Network Editor
windowrule = match:class ^nm-connection-editor$, float on, center on, size (monitor_w*0.4) (monitor_h*0.5)

# Calculator (Qalculate)
windowrule = match:class ^qalculate-gtk$, float on, center on, size (monitor_w*0.4) (monitor_h*0.5)

# -- File Manager (Thunar) --
# File Operation Progress (Fixed small rectangle)
windowrule = match:class ^[Tt]hunar$, match:title ^File Operation Progress$, float on, center on, size (monitor_w*0.3) (monitor_h*0.2)

# Thunar Catch-All (Properties, Alerts)
windowrule = match:class ^[Tt]hunar$, match:title ^(Confirm to Replace|Properties|Alert|Error|Attention)$, dim_around on, float on, center on, size (monitor_w*0.3) (monitor_h*0.4)

# Rename Dialog (Specific)
windowrule = match:class ^[Tt]hunar$, match:title ^Rename.*, dim_around on, float on, center on, size (monitor_w*0.3) (monitor_h*0.3)

# Image Viewer (imv)
windowrule = match:class ^imv$, dim_around on, float on, center on, size (monitor_w*0.5) (monitor_h*0.5)

# ------------------------------------------------------------------------------
#  Keybindings
# ------------------------------------------------------------------------------

$mainMod = SUPER

# -- Application Launchers --
bind = $mainMod, C, exec, qalculate-gtk
bind = $mainMod, E, exec, emacsclient -c -a "emacs"
bind = $mainMod, RETURN, exec, fuzzel
bind = $mainMod, SPACE, exec, kitty
bind = $mainMod, W, exec, brave 
bind = $mainMod, Z, exec, thunar

# -- System & UI Controls --
bind = $mainMod, minus, exec, killall -SIGUSR1 waybar
bind = $mainMod SHIFT, minus, exec, killall -SIGUSR2 waybar
bind = $mainMod, Home, exec, ~/.config/waybar/scripts/power-menu.sh
bind = $mainMod, Delete, exec, loginctl lock-session
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod SHIFT, N, exec, ~/.config/hypr/scripts/night_light.sh toggle
bind = $mainMod, V, exec, ~/.config/hypr/scripts/cliphist_selector.sh

# -- Window Management --
bind = $mainMod, F, togglefloating
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, P, pseudo
bind = $mainMod, Q, killactive
bind = $mainMod, Tab, layoutmsg, togglesplit

# -- Focus & Navigation (Vim-style) --
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# -- Window Movement & Resizing --
# Resize
bind = $mainMod SHIFT, l, resizeactive, 5 0
bind = $mainMod SHIFT, h, resizeactive, -5 0
bind = $mainMod SHIFT, k, resizeactive, 0 -5
bind = $mainMod SHIFT, j, resizeactive, 0 5

# Move Floating
bind = $mainMod ALT, l, moveactive, 5 0
bind = $mainMod ALT, h, moveactive, -5 0
bind = $mainMod ALT, k, moveactive, 0 -5
bind = $mainMod ALT, j, moveactive, 0 5

# Move Tiled
bind = $mainMod CTRL, l, movewindow, r
bind = $mainMod CTRL, h, movewindow, l
bind = $mainMod CTRL, k, movewindow, u
bind = $mainMod CTRL, j, movewindow, d

# -- XWayland Reset (fixes stuck pointer grabs) --
bind = $mainMod SHIFT, X, exec, pkill Xwayland

# -- Display Repair --
bind = $mainMod SHIFT, M, exec, ~/.config/hypr/scripts/display_profile.sh apply --notify
bind = $mainMod CTRL SHIFT, M, exec, ~/.config/hypr/scripts/display_profile.sh repair --notify

# -- Scratchpad, Groups, and Fast Focus --
bind = $mainMod, grave, togglespecialworkspace, scratchpad
bind = $mainMod SHIFT, grave, movetoworkspacesilent, special:scratchpad
bind = $mainMod, G, togglegroup
bind = $mainMod SHIFT, G, lockgroups, toggle
bind = $mainMod, bracketright, changegroupactive, f
bind = $mainMod, bracketleft, changegroupactive, b
bind = $mainMod, apostrophe, focuscurrentorlast
bind = $mainMod, period, cyclenext, visible
bind = $mainMod, comma, cyclenext, visible prev
bind = $mainMod SHIFT, bracketright, exec, ~/.config/hypr/scripts/move_current_workspace_to_monitor.sh next
bind = $mainMod SHIFT, bracketleft, exec, ~/.config/hypr/scripts/move_current_workspace_to_monitor.sh prev

# -- Mouse Bindings --
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# -- Workspaces --
# Switch Workspaces
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/workspace_handler.sh workspace 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/workspace_handler.sh workspace 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/workspace_handler.sh workspace 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/workspace_handler.sh workspace 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/workspace_handler.sh workspace 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/workspace_handler.sh workspace 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/workspace_handler.sh workspace 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/workspace_handler.sh workspace 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/workspace_handler.sh workspace 9
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/workspace_handler.sh workspace 0

# Move Window to Workspace
bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/scripts/workspace_handler.sh movetoworkspace 1
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/scripts/workspace_handler.sh movetoworkspace 2
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/workspace_handler.sh movetoworkspace 3
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/workspace_handler.sh movetoworkspace 4
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/workspace_handler.sh movetoworkspace 5
bind = $mainMod SHIFT, 6, exec, ~/.config/hypr/scripts/workspace_handler.sh movetoworkspace 6
bind = $mainMod SHIFT, 7, exec, ~/.config/hypr/scripts/workspace_handler.sh movetoworkspace 7
bind = $mainMod SHIFT, 8, exec, ~/.config/hypr/scripts/workspace_handler.sh movetoworkspace 8
bind = $mainMod SHIFT, 9, exec, ~/.config/hypr/scripts/workspace_handler.sh movetoworkspace 9
bind = $mainMod SHIFT, 0, exec, ~/.config/hypr/scripts/workspace_handler.sh movetoworkspace 0

# Send Window to Paired Workspace on Other Monitor
bind = $mainMod CTRL, 1, exec, ~/.config/hypr/scripts/swap_pair.sh 1
bind = $mainMod CTRL, 2, exec, ~/.config/hypr/scripts/swap_pair.sh 2
bind = $mainMod CTRL, 3, exec, ~/.config/hypr/scripts/swap_pair.sh 3
bind = $mainMod CTRL, 4, exec, ~/.config/hypr/scripts/swap_pair.sh 4
bind = $mainMod CTRL, 5, exec, ~/.config/hypr/scripts/swap_pair.sh 5
bind = $mainMod CTRL, 6, exec, ~/.config/hypr/scripts/swap_pair.sh 6
bind = $mainMod CTRL, 7, exec, ~/.config/hypr/scripts/swap_pair.sh 7
bind = $mainMod CTRL, 8, exec, ~/.config/hypr/scripts/swap_pair.sh 8
bind = $mainMod CTRL, 9, exec, ~/.config/hypr/scripts/swap_pair.sh 9
bind = $mainMod CTRL, 0, exec, ~/.config/hypr/scripts/swap_pair.sh 0

# -- Media & Hardware Keys --
# Volume and mute with OSD feedback
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/osd_control.sh volume up
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/osd_control.sh volume down
bindl = , XF86AudioMute, exec, ~/.config/hypr/scripts/osd_control.sh volume mute
bindl = , XF86AudioMicMute, exec, ~/.config/hypr/scripts/osd_control.sh volume micmute

# Brightness with OSD feedback
bindel = , XF86MonBrightnessUp,   exec, ~/.config/hypr/scripts/osd_control.sh brightness up
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/osd_control.sh brightness down
bindel = $mainMod, Prior, exec, ~/.config/hypr/scripts/osd_control.sh brightness up
bindel = $mainMod, Next,  exec, ~/.config/hypr/scripts/osd_control.sh brightness down

# Media Player with OSD feedback when SwayOSD is installed
bindl = , XF86AudioPlay, exec, ~/.config/hypr/scripts/osd_control.sh media play
bindl = , XF86AudioNext, exec, ~/.config/hypr/scripts/osd_control.sh media next
bindl = , XF86AudioPrev, exec, ~/.config/hypr/scripts/osd_control.sh media prev
bindl = , XF86AudioStop, exec, ~/.config/hypr/scripts/osd_control.sh media stop

# -- Screenshots --
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh output focused
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh output laptop
bind = ALT, Print, exec, ~/.config/hypr/scripts/screenshot.sh output external
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh clipboard
bind = $mainMod CTRL, Print, exec, ~/.config/hypr/scripts/screenshot.sh region
bind = $mainMod SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh edit

# ------------------------------------------------------------------------------
#  Workspace Rules (Monitor Assignments)
# ------------------------------------------------------------------------------

# Workspace placement is owned by display_profile.sh so hotplug can use
# runtime output names instead of stale connector assumptions.
# Dual: 1-10 laptop, 11-20 external. Laptop-only: 1-20 laptop.
