# ~/.config/tmux/tmux.conf — Cyberpunk Wireframe Edition (Server)
# Identical to desktop, server icon (󰒋) instead of terminal (), no GPU

# ----------------------
# Indexing
# ----------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ----------------------
# Hooks
# ----------------------
set-hook -g session-created  'run-shell "$HOME/.config/tmux/scripts/color-window.sh"'

# ----------------------
# Basic Settings
# ----------------------
unbind C-b
set -g prefix M-a
bind M-a send-prefix
set -g mouse on
set -g detach-on-destroy off
set -g default-terminal "tmux-256color"
set -g cursor-style blinking-block
set -as terminal-overrides ',*:Tc,*:Se=\E[2 q,*:Ss=\E[%p1%d q\E]12;#f8f8f2\a'
set -g update-environment "LANG LC_ALL"
setw -g mode-keys vi

# ----------------------
# Keybindings
# ----------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "#[fg=#50fa7b]Reloaded!"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind c new-window -c "$HOME" \; run-shell "$HOME/.config/tmux/scripts/color-window.sh"
bind -n M-n new-window -c "$HOME" \; run-shell "$HOME/.config/tmux/scripts/color-window.sh"
bind -n M-x confirm-before -p "Kill window #W? (y/n)" kill-window

# ----------------------
# Smart Splits
# ----------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Swap Panes (Directional) - Ctrl + Arrow Keys
bind -n C-Left if -F '#{pane_at_left}'   '' 'select-pane -L; swap-pane -s "!"; select-pane -L'
bind -n C-Down if -F '#{pane_at_bottom}' '' 'select-pane -D; swap-pane -s "!"; select-pane -D'
bind -n C-Up if -F '#{pane_at_top}'    '' 'select-pane -U; swap-pane -s "!"; select-pane -U'
bind -n C-Right if -F '#{pane_at_right}'  '' 'select-pane -R; swap-pane -s "!"; select-pane -R'

bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

bind -n M-Tab run-shell "$HOME/.config/tmux/scripts/toggle-layout.sh"

# Focus Panes (Alt + h/j/k/l)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Move Panes (Alt + Ctrl + h/j/k/l)
bind -n M-C-h if -F '#{pane_at_left}'   '' 'select-pane -L; swap-pane -s "!"; select-pane -L'
bind -n M-C-j if -F '#{pane_at_bottom}' '' 'select-pane -D; swap-pane -s "!"; select-pane -D'
bind -n M-C-k if -F '#{pane_at_top}'    '' 'select-pane -U; swap-pane -s "!"; select-pane -U'
bind -n M-C-l if -F '#{pane_at_right}'  '' 'select-pane -R; swap-pane -s "!"; select-pane -R'

# Move Windows (Shift + Alt + h/l)
bind -n M-H swap-window -t -1 \; select-window -t -1
bind -n M-L swap-window -t +1 \; select-window -t +1
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ----------------------
# VISUALS: Cyberpunk Wireframe
# ----------------------
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=default,fg=#f8f8f2'
set -g status-justify left

# Pane Borders
set -g pane-border-style 'fg=#44475A'
set -g pane-active-border-style 'fg=#6272A4'
set -g pane-border-lines single

set -g message-style 'fg=#f8f8f2,bg=default'
set -g message-command-style 'fg=#f8f8f2,bg=default'
set -g mode-style 'bg=#44475a,fg=#f8f8f2'

# Status Left: Server icon instead of terminal
set -g status-left-length 100
set -g status-left '#[fg=#bd93f9,bg=default][#[fg=#f8f8f2,bold] 󰒋 #S #[fg=#bd93f9,nobold]]─>> '

# Status Right: CPU + RAM (no GPU on server)
set -g status-right-length 150
set -g status-right "#{prefix_highlight}#[fg=#6272a4] |#($HOME/.config/tmux/scripts/cpu-status.sh)#[fg=#6272a4] |#($HOME/.config/tmux/scripts/ram-status.sh)"

# Window Tabs
setw -g window-status-format '#[fg=#6272a4,bg=default] #I:#W '
setw -g window-status-current-format '#[fg=#ff79c6,bg=default] [ #I:#W ] '
setw -g clock-mode-colour '#ff79c6'
setw -g clock-mode-style 12

# ----------------------
# Plugins
# ----------------------
unbind t
bind t display-popup -w 40% -h 30% -S "bg=#282A36,fg=#50FA7B" -E "~/.config/tmux/scripts/clock.sh"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-cpu'
# RAM handled by custom ram-status.sh script

set -g @prefix_highlight_bg '#ff5555'
set -g @prefix_highlight_fg '#282a36'
set -g @prefix_highlight_prefix_prompt ' WAIT '

run '~/.tmux/plugins/tpm/tpm'
