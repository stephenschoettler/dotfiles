# Fuzzel app launcher - Dracula themed for Hyprland

[main]
font=JetBrainsMono Nerd Font:size=14,Noto Sans:size=14
use-bold=yes
prompt="Search "
placeholder=Applications
icons-enabled=yes
terminal=kitty -e
fields=filename,name,generic,exec,categories,keywords,comment
match-mode=fuzzy
sort-result=yes
anchor=center
width=52
lines=9
horizontal-pad=24
vertical-pad=18
inner-pad=12
line-height=24
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes

[colors]
background=181922f0
text=f8f8f2ff
prompt=bd93f9ff
placeholder=6272a4ff
input=f8f8f2ff
match=ff79c6ff
selection=bd93f940
selection-text=f8f8f2ff
selection-match=ff79c6ff
counter=6272a4ff
border=bd93f99e

[border]
width=1
radius=24
selection-radius=14
