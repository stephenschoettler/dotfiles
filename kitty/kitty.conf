# vim:fileencoding=utf-8:foldmethod=marker

# Fonts {{{
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0
# }}}

# -----------------------------------------------------------------------------
# Definitive Dracula Color Scheme
# -----------------------------------------------------------------------------

foreground            #f8f8f2
background            #282a36
selection_foreground  #ffffff
selection_background  #44475a

# The Core 8 Palette
color0  #21222c
color1  #ff5555
color2  #50fa7b
color3  #f1fa8c
color4  #bd93f9
color5  #ff79c6
color6  #8be9fd
color7  #f8f8f2

# The Bright Palette (Improved Contrast for Terminal)
color8  #6272a4
color9  #ff6e6e
color10 #69ff94
color11 #ffffa5
color12 #d6acff
color13 #ff92df
color14 #a4ffff
color15 #ffffff

# The "Missing" Dracula Orange (Manual Mapping)
# This allows scripts to call #ffb86c specifically
color16 #ffb86c

# UI Elements
cursor            #f8f8f2
cursor_text_color background
url_color         #8be9fd

# Tab Bar Colors
active_tab_foreground   #282a36
active_tab_background   #f8f8f2
inactive_tab_foreground #282a36
inactive_tab_background #6272a4

# Marks
mark1_foreground #282a36
mark1_background #ff5555

# Window
background_opacity 0.80
dynamic_background_opacity yes
window_padding_width 4

# Bell
enable_audio_bell no
visual_bell_duration 0.1

# Mouse
copy_on_select yes

# Tab Bar
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# Other
confirm_os_window_close 0
